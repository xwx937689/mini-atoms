services:
  - type: web
    name: mini-atoms
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_API_KEY
        sync: false
      # Free tier cannot run Chromium (512MB). Keep browser check off online;
      # it reports "skipped" rather than pretending to pass.
      - key: BROWSER_CHECK
        value: "false"
      # Render terminates TLS at its edge and appends X-Forwarded-For.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RL_GENERATE
        value: "6"
      - key: RL_WINDOW
        value: "600"
      - key: LLM_TIMEOUT
        value: "180"
      - key: CORS_ALLOW_ALL
        value: "false"
